apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: poc-app-of-apps
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/eShoshoneDevOps/fleet-charts-gitops
    path: .
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {}
